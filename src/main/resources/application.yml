server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 8KB
  forward-headers-strategy: ${FORWARD_HEADERS:none}
  error: { include-message: never, include-stacktrace: never, include-binding-errors: never, include-exception: false }

spring:
  application.name: atendente-whatsapp
  config.import: "classpath:business.yml, optional:file:./config/business.yml"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atendente}
    username: ${DB_USER:atendente}
    password: ${DB_PASSWORD:atendente}
    hikari:
      maximum-pool-size: 10
      data-source-properties:
        # A trava por cliente espera no máximo 3 s; as outras duas são rede de segurança para chamadas HTTP lentas.
        options: "-c lock_timeout=3s -c statement_timeout=15s -c idle_in_transaction_session_timeout=60s"
  jpa: { hibernate.ddl-auto: validate, open-in-view: false }
  mvc.problemdetails.enabled: true
  lifecycle.timeout-per-shutdown-phase: 20s

management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never

app:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  # turn-budget limita o tempo com a conversa travada: nenhuma consulta à agenda começa sem caber nele.
  conversation: { expires-after: 30m, duplicate-confirmation-window: 2m, max-slot-options: 6, next-day-search-days: 6, turn-budget: 8s }
  # min-advance espelha a antecedência mínima do agendamento-api, para explicar por que um horário não serve.
  booking: { days-ahead: 30, max-active-per-customer: 3, min-advance: 30m }
  scheduling-api:
    base-url: ${AGENDAMENTO_API_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s
    catalog-ttl: 60s
    reconciliation-retry-delay: 1s
    max-calls-per-turn: 14
