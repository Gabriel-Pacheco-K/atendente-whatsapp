server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 8KB
  forward-headers-strategy: ${FORWARD_HEADERS:none}
  error: { include-message: never, include-stacktrace: never, include-binding-errors: never, include-exception: false }

spring:
  application.name: atendente-whatsapp
  config.import: "classpath:business.yml, optional:file:./config/business.yml"
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:atendente}${DB_URL_PARAMS:}}
    username: ${DB_USER:atendente}
    password: ${DB_PASSWORD:atendente}
    hikari:
      maximum-pool-size: 10
      data-source-properties:
        # A trava por cliente espera no máximo 3 s; as outras duas são rede de segurança para chamadas HTTP lentas.
        options: "-c lock_timeout=3s -c statement_timeout=15s -c idle_in_transaction_session_timeout=60s"
  jpa: { hibernate.ddl-auto: validate, open-in-view: false }
  mvc.problemdetails.enabled: true
  # Nenhuma rota recebe arquivo; ligado, o corpo multipart seria lido antes da verificação da assinatura do webhook.
  servlet.multipart.enabled: false
  lifecycle.timeout-per-shutdown-phase: 20s

management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never

app:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  # turn-budget limita as consultas à agenda num turno, com a conversa travada: nenhuma começa sem caber nele. Mais
  # que o dobro do read timeout, para caber uma conferência depois de um agendamento ou cancelamento sem resposta.
  conversation: { expires-after: 30m, duplicate-confirmation-window: 2m, max-slot-options: 6, next-day-search-days: 6, turn-budget: 12s }
  # min-advance espelha a antecedência mínima do agendamento-api, para explicar por que um horário não serve.
  booking: { days-ahead: 30, max-active-per-customer: 3, min-advance: 30m }
  scheduling-api:
    base-url: ${AGENDAMENTO_API_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s
    catalog-ttl: 60s
    reconciliation-retry-delay: 1s
    max-calls-per-turn: 14
  web:
    enabled: true
    show-diagnostics: ${SHOW_DIAGNOSTICS:true}
    messages-per-minute: 20
    requests-per-minute-per-ip: 60
    sessions-per-hour-per-ip: 10
    max-body: 16KB
  painel:
    password: ${PAINEL_SENHA:}
    notify-phone: ${PAINEL_AVISO_WHATSAPP:}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    messages-per-minute: 30
    max-message-age: 24h
    max-messages-per-payload: 50
    max-body: 256KB
    sending:
      enabled: ${WHATSAPP_SENDING_ENABLED:false}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      graph-url: https://graph.facebook.com
      graph-api-version: ${WHATSAPP_GRAPH_VERSION:v23.0}
      connect-timeout: 2s
      read-timeout: 5s
  # WhatsApp pela Twilio (sandbox grátis), no lugar da Cloud API da Meta.
  twilio:
    enabled: ${TWILIO_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_WHATSAPP_FROM:+14155238886}
    webhook-url: ${TWILIO_WEBHOOK_URL:}
  ai:
    claude:
      enabled: ${CLAUDE_ENABLED:true}       # só tem efeito com ANTHROPIC_API_KEY
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${CLAUDE_MODEL:claude-haiku-5-5}
      effort: ${CLAUDE_EFFORT:low}
      max-tokens: 2048
      timeout: 6s
      base-url: ${ANTHROPIC_BASE_URL:}
      rules-confidence-threshold: 0.75
  # Nenhum texto de cliente é guardado; a resposta da web fica 24 h só para o reenvio idempotente.
  retention: { enabled: true, processed-messages: 14d, web-replies: 24h, web-customers: 7d, whatsapp-customers: 180d }
