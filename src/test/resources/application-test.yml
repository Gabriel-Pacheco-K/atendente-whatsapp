app:
  ai.claude: { api-key: "", base-url: "http://localhost:1" }
  retention.enabled: false
  web.show-diagnostics: true
  # A pausa antes da segunda conferência da agenda é de verdade nos testes com Spring; curta, o teste não demora.
  scheduling-api.reconciliation-retry-delay: 50ms
  painel.password: "senha-de-teste"
  # O webhook fica ligado em todos os testes com Spring, com segredos que só valem aqui; o envio vai para o WireMock
  # da Graph API. O segredo é o dos vetores de assinatura conferidos com o openssl.
  whatsapp:
    enabled: true
    verify-token: "token-de-verificacao-dos-testes-0123456789"
    app-secret: "segredo-de-teste"
    phone-number-id: "123456789012345"
    sending: { enabled: true, access-token: "token-de-acesso-dos-testes" }
